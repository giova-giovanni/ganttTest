# Compila Gantt Planner e lo pubblica su GitHub Pages.
#
# Pages non sa eseguire i sorgenti (TypeScript/React): serve la cartella dist/ prodotta da
# «npm run build». Da attivare una volta sola: Settings → Pages → Build and deployment →
# Source: «GitHub Actions».
name: Pubblica su GitHub Pages

on:
  push:
    # i salvataggi dell'archivio (se il file dati sta in questo repository) non ripubblicano il sito
    paths-ignore:
      - 'gantt-dati*.json'
      - 'dati/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # si pubblica solo il ramo principale del repository (o a mano da «Run workflow»)
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
